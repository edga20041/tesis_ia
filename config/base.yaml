project:
  name: tesis_ia
  version: 0.1.0
  seed: 42

paths:
  data_dir: ./data
  artifacts_dir: ./artifacts
  outputs_dir: ./outputs
  logs_dir: ./logs

runtime:
  environment: development
  use_gpu: true
  num_workers: 4

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/app.log
