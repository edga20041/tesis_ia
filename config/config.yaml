project:
  name: tesis_ia_predictiva
  version: 0.1.0
  seed: 42

paths:
  data_dir: ./data
  artifacts_dir: ./artifacts
  outputs_dir: ./outputs

data:
  processed_path: data/processed/dataset_enriquecido.csv
  train_years: [2021, 2022, 2023, 2024]
  test_years: [2025]
  target_column: unidades_vendidas
  features: 
    - lag_1
    - lag_2
    - lag_12
    - ma_3m
    - price_gap_pct
    - market_share_unidades
    - temp_max_promedio
    - precipitacion_mm
    - ipc_indice
    - tipo_cambio_pyg_usd

model:
  family: linear_model
  architecture: multiple_regression
  
training:
  metrics: [mape, rmse]

evaluation:
  metrics: [mape, rmse]
  generate_plots: true
  plot_types:
    - feature_importance
    - actual_vs_predicted