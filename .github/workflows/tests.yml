name: Pruebas automatizadas

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Suite de pruebas (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.10 es la version de la imagen de produccion (ver Dockerfile): las
      # versiones fijadas en requirements.txt no compilan en interpretes mas nuevos.
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==7.4.0 pytest-cov==4.1.0 httpx

      - name: Ejecutar suite de pruebas
        run: python -m pytest --cov=src/tesis_ia --cov-report=term
